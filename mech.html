<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Mech Arena</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px;
            font-size: 24px;
            text-shadow: 0 0 10px #00ffff;
        }

        #scoreboard {
            font-size: 18px;
            margin-bottom: 10px;
        }

        canvas {
            border: 4px solid #00ffff;
            background-color: #111111;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .controls-info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaaaaa;
        }
    </style>
</head>

<body>

    <h1>MECH ARENA</h1>
    <div id="scoreboard">Skor: <span id="score">0</span> | Nyawa Mech: <span id="hp">100</span></div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls-info">
        Gunakan tombol <b>W, A, S, D</b> untuk bergerak | Klik <b>Kiri Mouse</b> untuk menembak
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        // Posisi dan Properti Mech Pemain
        let player = {
            x: 100,
            y: canvas.height / 2 - 20,
            width: 40,
            height: 40,
            speed: 5,
            hp: 100,
            color: "#00ffff"
        };

        let keys = {};
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        // Deteksi Tombol Keyboard
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        // Deteksi Klik Mouse untuk Menembak
        window.addEventListener("click", (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Hitung arah peluru berdasarkan posisi mouse
            const angle = Math.atan2(mouseY - (player.y + player.height / 2), mouseX - (player.x + player.width / 2));
            const speed = 8;

            bullets.push({
                x: player.x + player.width / 2,
                y: player.y + player.height / 2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 5
            });
        });

        // Spawn Musuh Secara Berkala
        setInterval(() => {
            if (isGameOver) return;
            enemies.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - 40),
                width: 40,
                height: 40,
                speed: 2,
                hp: 2,
                color: "#ff3333"
            });
        }, 2000);

        // Update Logika Game
        function update() {
            if (isGameOver) return;

            // Pergerakan Pemain
            if (keys["w"] && player.y > 0) player.y -= player.speed;
            if (keys["s"] && player.y + player.height < canvas.height) player.y += player.speed;
            if (keys["a"] && player.x > 0) player.x -= player.speed;
            if (keys["d"] && player.x + player.width < canvas.width / 2) player.x += player.speed; // Batas area setengah layar

            // Update Peluru Pemain
            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;

                // Hapus peluru jika keluar layar
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(index, 1);
                }
            });

            // Update Musuh
            enemies.forEach((enemy, eIndex) => {
                enemy.x -= enemy.speed;

                // Musuh menembak ke arah pemain secara acak
                if (Math.random() < 0.01) {
                    const angle = Math.atan2((player.y + player.height / 2) - (enemy.y + enemy.height / 2), player.x - enemy.x);
                    enemyBullets.push({
                        x: enemy.x,
                        y: enemy.y + enemy.height / 2,
                        vx: Math.cos(angle) * 4,
                        vy: Math.sin(angle) * 4,
                        radius: 4
                    });
                }

                // Cek tabrakan peluru pemain dengan musuh
                bullets.forEach((b, bIndex) => {
                    if (
                        b.x > enemy.x && b.x < enemy.x + enemy.width &&
                        b.y > enemy.y && b.y < enemy.y + enemy.height
                    ) {
                        enemy.hp--;
                        bullets.splice(bIndex, 1);
                        if (enemy.hp <= 0) {
                            enemies.splice(eIndex, 1);
                            score += 10;
                        }
                    }
                });

                // Cek jika musuh menabrak pemain
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    player.hp -= 10;
                    enemies.splice(eIndex, 1);
                    if (player.hp <= 0) isGameOver = true;
                }

                // Hapus musuh jika lewat layar
                if (enemy.x + enemy.width < 0) {
                    enemies.splice(eIndex, 1);
                }
            });

            // Update Peluru Musuh
            enemyBullets.forEach((eb, index) => {
                eb.x += eb.vx;
                eb.y += eb.vy;

                // Cek tabrakan peluru musuh dengan pemain
                if (
                    eb.x > player.x && eb.x < player.x + player.width &&
                    eb.y > player.y && eb.y < player.y + player.height
                ) {
                    player.hp -= 10;
                    enemyBullets.splice(index, 1);
                    if (player.hp <= 0) isGameOver = true;
                }
            });

            // Update UI HTML
            document.getElementById("score").innerText = score;
            document.getElementById("hp").innerText = Math.max(0, player.hp);
        }

        // Render Grafik ke Canvas
        function draw() {
            // Bersihkan layar
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Garis Tengah Arena
            ctx.strokeStyle = "#333333";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gambar Pemain (Mech Biru)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Detail Mech Pemain
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(player.x + 25, player.y + 12, 15, 16);

            // Gambar Peluru Pemain
            ctx.fillStyle = "#00ffff";
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Gambar Musuh (Mech Merah)
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });

            // Gambar Peluru Musuh
            ctx.fillStyle = "#ff3333";
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Tampilan Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "20px sans-serif";
                ctx.fillText("Muat ulang halaman (F5) untuk bermain lagi.", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        // Main Loop Game
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>

</html>
